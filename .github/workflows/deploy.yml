name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # https://marchone.officialgl.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Migrate first so new code never runs against an old schema.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
          GL_ACCOUNT_KEY: ${{ secrets.GL_ACCOUNT_KEY }}
          GOOGLE_MAPS_BROWSER_KEY: ${{ vars.GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          [ -n "$BETTER_AUTH_SECRET" ] || echo "::warning::BETTER_AUTH_SECRET is not set as a GitHub secret. Login fails unless it was set with 'wrangler secret put'."
          [ -n "$GOOGLE_MAPS_SERVER_KEY" ] || echo "::warning::GOOGLE_MAPS_SERVER_KEY is not set. Routes fall back to straight lines."
          [ -n "$GL_ACCOUNT_KEY" ] || echo "::warning::GL_ACCOUNT_KEY is not set. GL Account login stays signed out."
          [ -n "$GOOGLE_MAPS_BROWSER_KEY" ] || echo "::warning::GOOGLE_MAPS_BROWSER_KEY variable is not set. The app shows the SVG map."
          # Secrets set here are additive: an unset one keeps its previous value on the Worker.
          node -e '
            const s = {};
            for (const k of ["BETTER_AUTH_SECRET", "GOOGLE_MAPS_SERVER_KEY", "GL_ACCOUNT_KEY"]) if (process.env[k]) s[k] = process.env[k];
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(s));
          '
          ARGS=(--secrets-file "$RUNNER_TEMP/secrets.json")
          [ -n "$GOOGLE_MAPS_BROWSER_KEY" ] && ARGS+=(--var "GOOGLE_MAPS_BROWSER_KEY:$GOOGLE_MAPS_BROWSER_KEY")
          npx wrangler deploy "${ARGS[@]}"
          rm -f "$RUNNER_TEMP/secrets.json"
